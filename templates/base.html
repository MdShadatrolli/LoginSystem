<!DOCTYPE html>
<html lang="en">
<head>
    <title>{%block title%}My Feedback System{% endblock %}</title>
    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        h1 {
            color: #333;
        }
        p {
            font-size: 20px;
        }
        nav a {
            margin: 0 10px;
            text-decoration: none;
            color: #007BFF;
        }
        nav a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <nav>

            <a href="/feedback">Feedback</a> |

        </nav>
        
    </header>
    <main>
        {% block content %}{% endblock %}
    </main> 
    <footer>
        <p>&copy; 2026 My Feedback System. All rights reserved.</p>

    </footer>
    
</body>
</html>
